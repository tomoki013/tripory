    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    settings:
      base:
        DEVELOPMENT_TEAM: 7GU925RQ99
        PRODUCT_BUNDLE_IDENTIFIER: io.tmkch.tripory
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Tripory
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CURRENT_PROJECT_VERSION: 5
        MARKETING_VERSION: 1.0.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: $(inherited) -ObjC
        TRIPORY_APP_STORE_ID: ""
      configs:
        Debug:
          ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
          ADMOB_BANNER_AD_UNIT_ID: ca-app-pub-3940256099942544/2435281174
          ADMOB_INTERSTITIAL_AD_UNIT_ID: ca-app-pub-3940256099942544/4411468910
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG ADS_TESTING
        Release:
          ADMOB_APP_ID: ca-app-pub-8687520805381056~8307684634
          ADMOB_BANNER_AD_UNIT_ID: ca-app-pub-8687520805381056/2277728834
          ADMOB_INTERSTITIAL_AD_UNIT_ID: ca-app-pub-8687520805381056/7018653694
    preBuildScripts:
      - path: Scripts/validate-admob-archive.sh
        name: Validate Release AdMob configuration
        basedOnDependencyAnalysis: false
        showEnvVars: false
  TriporyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TriporyTests
    dependencies:
      - target: Tripory
      - sdk: StoreKitTest.framework
    settings:
      base:
        DEVELOPMENT_TEAM: 7GU925RQ99
        PRODUCT_BUNDLE_IDENTIFIER: io.tmkch.tripory.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  TriporyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TriporyUITests
    dependencies:
      - target: Tripory
    settings:
      base:
        DEVELOPMENT_TEAM: 7GU925RQ99
        PRODUCT_BUNDLE_IDENTIFIER: io.tmkch.tripory.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

schemes:
  Tripory:
    build:
      targets:
        Tripory: all
        TriporyTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Tripory/Resources/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: Tripory/Resources/Products.storekit
      targets:
        - TriporyTests
        - TriporyUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
