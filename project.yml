name: Tripory
options:
  bundleIdPrefix: com.tomokichi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ja
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.7.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
targets:
  Tripory:
    type: application
    platform: iOS
    sources:
      - Tripory
    info:
      path: Tripory/Resources/Info.plist
      properties:
        CFBundleDisplayName: Tripory
        UILaunchScreen: {}
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        ITSAppUsesNonExemptEncryption: false
        AdMobBannerAdUnitID: $(ADMOB_BANNER_AD_UNIT_ID)
        AdMobInterstitialAdUnitID: $(ADMOB_INTERSTITIAL_AD_UNIT_ID)
        TriporyAppStoreID: $(TRIPORY_APP_STORE_ID)
        NSUserTrackingUsageDescription: "無料版の広告をより適切に表示するため、許可された場合に限り広告識別子を使用します。"
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
